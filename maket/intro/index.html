<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro — interactive model</title>
<script>(function(){
  var phone=innerWidth<700||(innerHeight<=500&&innerWidth>innerHeight);
  document.documentElement.dataset.layout=phone?"phone":"desktop";
  document.documentElement.dataset.fit=(!phone&&innerWidth<1150)?"crop":"contain";
})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#e4e8eb; --dim:#8c959c; --line:#2c343a; --glow:#e9b44c;
         --canvas-w:100vw; --tablet-w:calc(var(--canvas-w) * 0.68);
         --ref-w:1150px; --tablet-scale:1; --mic-ratio:0.12 }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0b0d0f;color:var(--ink);
    font:13px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{display:flex;flex-direction:column}
  #wrap{flex:1;display:grid;place-items:center;min-height:0;position:relative;z-index:0;overflow:hidden}
  /* pinned to the viewport; pointer-transparent except real controls on the screen */
  #tabletWrap{position:fixed;left:0;bottom:0;width:var(--tablet-w);z-index:2;pointer-events:none;
          transform-origin:left bottom;will-change:transform}
  /* continues the dark marble plane from maket_base → black at the viewport bottom */
  #belowTablet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:1;pointer-events:none;
       background:linear-gradient(to bottom left, #16171b 0%, #000 100%)}
  #tablet{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
  /* real controls laid over the drawn ones; positions are shares of the image box,
     so they follow the tablet through parallax and any resize */
  #ui{position:absolute;inset:0;pointer-events:none}
  /* one axonometric row: shared rotate matches the screen plane; left drifts down the column.
     pointer-events on the row so the gap between switch and label stays in the hover zone */
  .trow{position:absolute;display:flex;align-items:center;gap:0.55em;pointer-events:auto;cursor:pointer;
       padding:0.55em 0.75em;margin:-0.55em -0.75em;transform-origin:left center;
       -webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
  .tsw{position:relative;flex:none;pointer-events:auto;width:calc(var(--tablet-w) * 0.033);aspect-ratio:1.88;
       border:0;padding:0;border-radius:999px;background:#0d1520;cursor:pointer;
       transition:all .35s ease;
       box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 rgba(0,128,209,0);
       overflow:hidden;
       -webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
  .tsw:focus,.tsw:focus-visible{outline:none}
  /* blue fill as opacity layer — gradients don't interpolate, opacity does */
  .tsw::before{content:"";position:absolute;inset:0;border-radius:inherit;
       background:linear-gradient(135deg,#0090e8,#0080d1 45%,#006bb0);
       opacity:0;transition:all .35s ease;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .tsw::after{content:"";position:absolute;z-index:1;top:9%;bottom:9%;aspect-ratio:1;border-radius:50%;
       background:linear-gradient(160deg,#f4f8fb,#d7e6f2);left:5%;
       transition:all .35s ease;
       box-shadow:0 1px 2px rgba(0,40,80,.35)}
  .tsw[aria-checked="true"]{box-shadow:inset 0 0 0 1px rgba(0,100,180,.4),0 0 10px rgba(0,128,209,.45)}
  .tsw[aria-checked="true"]::before{opacity:1}
  .tsw[aria-checked="true"]::after{left:51.4%}
  /* base gradient + hover layer crossfade (gradients themselves don't transition) */
  .tlab{position:relative;flex:none;pointer-events:auto;cursor:pointer;
       font:400 calc(var(--tablet-w) * 0.0143)/1.1 "Russo One",sans-serif;
       letter-spacing:-0.02em;white-space:nowrap;
       background:linear-gradient(180deg,#f2f6fa 0%,#c5d0dc 55%,#9aabb8 100%);
       -webkit-background-clip:text;background-clip:text;color:transparent;
       text-shadow:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.75)) drop-shadow(0 0 6px rgba(120,180,220,.2));
       transition:all .35s ease;
       -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  .tlab::after{content:attr(data-text);position:absolute;left:0;top:0;
       background:linear-gradient(180deg,#ffffff 0%,#f2f9ff 40%,#c8e4ff 100%);
       -webkit-background-clip:text;background-clip:text;color:transparent;
       opacity:0;pointer-events:none;transition:all .35s ease}
  /* hover polish only on fine pointers — no sticky hover on touch */
  @media (hover:hover) and (pointer:fine){
    .tsw:hover,
    .trow:hover .tsw{background:#1c2c40;
         box-shadow:inset 0 0 0 1px rgba(180,220,255,.4),0 0 14px rgba(0,160,240,.45)}
    .tsw:hover::before,
    .trow:hover .tsw::before{opacity:.42}
    .tsw[aria-checked="true"]:hover,
    .trow:hover .tsw[aria-checked="true"]{
         box-shadow:inset 0 0 0 1px rgba(140,210,255,.75),0 0 22px rgba(0,180,255,.9),0 0 8px rgba(100,210,255,.55)}
    .tsw[aria-checked="true"]:hover::before,
    .trow:hover .tsw[aria-checked="true"]::before{opacity:1;filter:brightness(1.18)}
    .tlab:hover,
    .trow:hover .tlab{filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))
         drop-shadow(0 0 8px rgba(160,220,255,.7)) drop-shadow(0 0 18px rgba(80,190,255,.65))}
    .tlab:hover::after,
    .trow:hover .tlab::after{opacity:1}
  }
  /* switches locked while mic voice demo runs — no clicks, no hover polish */
  #ui.is-voice .trow{pointer-events:none;cursor:default;opacity:.4;filter:grayscale(.35)}
  #ui.is-voice .trow:hover .tsw,
  #ui.is-voice .tsw:hover{background:#0d1520;
       box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 rgba(0,128,209,0)}
  #ui.is-voice .trow:hover .tsw::before,
  #ui.is-voice .tsw:hover::before{opacity:0}
  #ui.is-voice .trow:hover .tsw[aria-checked="true"],
  #ui.is-voice .tsw[aria-checked="true"]:hover{
       box-shadow:inset 0 0 0 1px rgba(0,100,180,.4),0 0 10px rgba(0,128,209,.45)}
  #ui.is-voice .trow:hover .tsw[aria-checked="true"]::before,
  #ui.is-voice .tsw[aria-checked="true"]:hover::before{opacity:1;filter:none}
  #ui.is-voice .trow:hover .tlab,
  #ui.is-voice .tlab:hover{filter:drop-shadow(0 1px 2px rgba(0,0,0,.75)) drop-shadow(0 0 6px rgba(120,180,220,.2))}
  #ui.is-voice .trow:hover .tlab::after,
  #ui.is-voice .tlab:hover::after{opacity:0}
  @property --mic{
    syntax:"<number>";
    inherits:true;
    initial-value:0;
  }
  @property --gr{syntax:"<number>";inherits:true;initial-value:0}
  @property --gg{syntax:"<number>";inherits:true;initial-value:170}
  @property --gb{syntax:"<number>";inherits:true;initial-value:255}
  @property --mic-tilt{
    syntax:"<number>";
    inherits:true;
    initial-value:1;
  }
  .tmic{position:absolute;pointer-events:auto;cursor:pointer;width:calc(var(--tablet-w) * 0.12);
       --mic:0;--gr:0;--gg:170;--gb:255;--mic-tilt:1;transform-origin:center bottom;
       font-size:calc(var(--tablet-w) * 0.12 * 0.11);
       transform:rotate(-8.12deg) skewX(9.5deg);
       transition:transform .5s ease,--gr .45s ease,--gg .45s ease,--gb .45s ease,--mic-tilt .5s ease;
       -webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
  .tmic:focus,.tmic:focus-visible{outline:none}
  .tmic.is-live{--gr:233;--gg:180;--gb:76;--mic-tilt:0;
       transform:translate(42%, 48%) scale(1.45)}
  .tmic img{display:block;width:100%;height:auto;transform-origin:center bottom;
       transform:scale(calc(1 + 0.07 * var(--mic))) scaleY(calc(1 + 0.12 * var(--mic)))
                 translateY(calc(-6% * var(--mic)));
       filter:drop-shadow(0 0 calc(6px + 10px * var(--mic)) rgba(var(--gr),var(--gg),var(--gb),calc(0.35 + 0.5 * var(--mic))))
              drop-shadow(0 0 calc(14px + 18px * var(--mic)) rgba(var(--gr),var(--gg),var(--gb),calc(0.15 + 0.35 * var(--mic))))
              drop-shadow(0 2px 8px rgba(0,0,0,.55))}
  /* voice caption — same bubble as maket screen-3, sized in em of .tmic font-size */
  .tmic .mic-caption{position:absolute;left:50%;bottom:30%;z-index:9;box-sizing:border-box;
       margin-left:0;padding:0.55em 0.85em;min-width:18em;
       border:0.14em solid #1e4a72;border-radius:0.7em;
       background:rgba(44,92,133,.94);color:#fff;
       font:400 1em/1.35 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       text-align:left;white-space:nowrap;pointer-events:none;
       box-shadow:0 0.4em 1.2em rgba(31,58,82,.22);
       transition:opacity .35s ease,visibility .35s ease}
  .tmic .mic-caption.is-hidden{opacity:0;visibility:hidden}
  .tmic .mic-caret{display:inline-block;margin-left:0.05em;animation:micCaretBlink .9s step-end infinite}
  @keyframes micCaretBlink{0%,100%{opacity:1}50%{opacity:0}}
  canvas{display:block;width:100%;height:auto;max-height:100%;touch-action:none;
         will-change:transform}
  #boot{position:fixed;inset:0;display:grid;place-content:center;color:var(--dim);background:#0b0d0f}

  /*
    Layout modes (html[data-layout] / data-fit):
      desktop + contain — ≥1150: canvas fits wrap, parallax
      desktop + crop    — 700–1149: canvas keeps ref height, side-crop, parallax
      phone             — <700: full-bleed mobile tablet / caption
  */

  /* ---- desktop crop: fixed height from ref width, overflow sides ---- */
  html[data-layout="desktop"][data-fit="crop"],
  html[data-layout="desktop"][data-fit="crop"] body{height:100%;overflow:hidden;background:#000}
  html[data-layout="desktop"][data-fit="crop"] #wrap{display:block;background:#000}
  html[data-layout="desktop"][data-fit="crop"] canvas{position:absolute;left:50%;top:0;
         width:calc(var(--stage-h) * var(--canvas-aspect, 1.5)) !important;
         max-width:none;max-height:none;height:var(--stage-h) !important;
         margin:0 !important;transform:translateX(-50%)}

  /* ---- phone ---- */
  html[data-layout="phone"]{ --tablet-w:100vw; --tablet-scale:1.18; --mic-ratio:0.145 }
  html[data-layout="phone"],
  html[data-layout="phone"] body{height:100dvh;overflow:hidden;background:#000}
  html[data-layout="phone"] #wrap{display:block;background:#000}
  html[data-layout="phone"] canvas{position:absolute;left:50%;top:0;width:255% !important;max-width:none;
         max-height:none;height:auto !important;margin:0 !important;
         transform:translateX(-50%)}
  html[data-layout="phone"] #tabletWrap{left:50%;top:50%;bottom:auto;width:var(--tablet-w);
         transform:translate(-50%,-50%) scale(var(--tablet-scale));transform-origin:center center}
  html[data-layout="phone"] .tsw{width:calc(var(--tablet-w) * 0.042)}
  /* labels from tablet width — 2.8vw blows up in landscape where tablet ≪ viewport */
  html[data-layout="phone"] .tlab{font-size:clamp(10px, calc(var(--tablet-w) * 0.038), 15px)}
  html[data-layout="phone"] .tmic{width:calc(var(--tablet-w) * var(--mic-ratio));
         font-size:calc(var(--tablet-w) * 0.034);
         transform:translateX(50%)}
  html[data-layout="phone"] .tmic.is-live{transform:translateX(50%)}
  html[data-layout="phone"] .tmic img{transform:rotate(calc(-8.12deg * var(--mic-tilt))) skewX(calc(9.5deg * var(--mic-tilt)))
         scale(calc(1 + 0.07 * var(--mic))) scaleY(calc(1 + 0.12 * var(--mic)))
         translateY(calc(-6% * var(--mic)))}
  html[data-layout="phone"] .tmic .mic-caption{left:calc(50% - 100%);bottom:6%;
         width:calc(var(--tablet-w) * 0.9 / var(--tablet-scale));
         min-width:0;max-width:none;padding:0.45em 0.7em;
         text-align:center;white-space:nowrap;
         transform:translate(-50%, 100%);
         line-height:1.25}

  /* Fill width (cover): short landscape used to letterbox because canvas was height-capped.
     Tablet tracks viewport width, not the old 52vh cap that kept it tiny next to side bars. */
  html[data-layout="phone"][data-orient="landscape"]{ --tablet-w:min(42vw, 400px); --tablet-scale:1.04 }
  html[data-layout="phone"][data-orient="landscape"] .tsw{width:calc(var(--tablet-w) * 0.048)}
  html[data-layout="phone"][data-orient="landscape"] .tlab{font-size:clamp(8px, calc(var(--tablet-w) * 0.045), 12px)}
  html[data-layout="phone"][data-orient="landscape"] .trow{gap:0.4em}
  html[data-layout="phone"][data-orient="landscape"] #wrap{display:block;position:relative;height:100%;overflow:hidden;background:#000}
  html[data-layout="phone"][data-orient="landscape"] canvas{position:absolute;left:50%;top:0;
         width:100% !important;height:auto !important;max-width:none;max-height:none;
         margin:0 !important;transform:translateX(-50%);object-fit:unset}
</style>
</head>
<body>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="belowTablet" aria-hidden="true"></div>
<div id="tabletWrap">
  <img id="tablet" src="../img/intro/tablet.webp" alt="">
  <div id="ui"></div>
</div>


<div id="boot">Загрузка…</div>

<script>

const WIN_FEATHER = 1.3;  // edge of a single window
const WIN_INSET = 0.86;   // cells shrink toward their centre, leaving the mullions untouched

const c = document.getElementById("c"), x = c.getContext("2d");
const $ = id => document.getElementById(id);
const load = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = s; });
const cv = (w, h) => { const e = document.createElement("canvas"); e.width = w; e.height = h; return e; };

let W, H, imgBase, imgOff, imgAll;
let cutOff, cutAll;
let litHard, litSoft, litLayer; // reused offscreen canvases (no alloc per fade frame)

const LIGHT_FADE_MS = 120;    // on/off fade for windows
const grids = GRIDS.filter(Boolean).map(g => ({ ...g, cols: g.cols.map(p => p.slice()) }));
/* ---- show state ----
   These four used to be read straight off the bottom bar's controls. The bar is gone,
   so they live here and are driven through the API at the end of this file. */
let lightAll = false;     // master light: false = every window dark, true = every window lit
let demoOn   = false;     // page-wide demo, all zones at once
let soloOn   = false;     // within the demo: one building at a time, the rest dark

/* ---- projective mapping between the rectified facade and the canvas ---- */
function apply(m, u, v){
  const w = m[6] * u + m[7] * v + m[8];
  return [(m[0] * u + m[1] * v + m[2]) / w * W, (m[3] * u + m[4] * v + m[5]) / w * H];
}
const toCanvas = (g, u, v) => apply(g.r2n, u, v);

// every zone keeps its own rectified space; the flat index of a cell is its identity
function buildCells(){
  win = []; span = [];
  for (const g of grids){
    const start = win.length;
    for (const [y0, y1] of g.rows)
      for (const [a, b] of g.cols)
        win.push([toCanvas(g, a, y0), toCanvas(g, b, y0), toCanvas(g, b, y1), toCanvas(g, a, y1)]);
    span.push([start, win.length - start]);
  }
  cell = win.map(inset);
}

// scaling a quad about its centroid keeps every edge parallel to the original,
// so the gap follows the mullions instead of cutting across them
function inset(p){
  const cx = p.reduce((s, q) => s + q[0], 0) / p.length;
  const cy = p.reduce((s, q) => s + q[1], 0) / p.length;
  return p.map(q => [cx + (q[0] - cx) * WIN_INSET, cy + (q[1] - cy) * WIN_INSET]);
}

function fillPolys(ctx, list){
  ctx.fillStyle = "#fff";
  for (const p of list){
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    ctx.closePath(); ctx.fill();
  }
}
function cutTo(img, maskCanvas){
  const e = cv(W, H), ex = e.getContext("2d");
  ex.drawImage(img, 0, 0, W, H);
  ex.globalCompositeOperation = "destination-in";
  ex.drawImage(maskCanvas, 0, 0);
  return e;
}
function ensureLitCanvases(){
  if (litHard && litHard.width === W) return;
  litHard = cv(W, H);
  litSoft = cv(W, H);
  litLayer = cv(W, H);
}
function softMask(list){
  const hard = cv(W, H);
  fillPolys(hard.getContext("2d"), list);
  const e = cv(W, H), ex = e.getContext("2d");
  ex.filter = `blur(${WIN_FEATHER}px)`;
  ex.drawImage(hard, 0, 0);
  return e;
}

// per-window brightness 0..1 in the mask alpha, then the same feather as hard cells
function softMaskLevels(levels){
  ensureLitCanvases();
  const hx = litHard.getContext("2d");
  hx.clearRect(0, 0, W, H);
  for (let i = 0; i < levels.length; i++){
    const a = levels[i];
    if (a < 0.001) continue;
    const p = cell[i];
    hx.fillStyle = a >= 0.999 ? "#fff" : `rgba(255,255,255,${a})`;
    hx.beginPath();
    hx.moveTo(p[0][0], p[0][1]);
    for (let j = 1; j < p.length; j++) hx.lineTo(p[j][0], p[j][1]);
    hx.closePath();
    hx.fill();
  }
  const ex = litSoft.getContext("2d");
  ex.clearRect(0, 0, W, H);
  ex.filter = `blur(${WIN_FEATHER}px)`;
  ex.drawImage(litHard, 0, 0);
  ex.filter = "none";
  return litSoft;
}

function targetLevel(i){
  const o = over[i];
  return (o === null ? lightAll : o) ? 1 : 0;
}

function rebuildLitLayer(){
  ensureLitCanvases();
  const mask = softMaskLevels(level);
  const ex = litLayer.getContext("2d");
  ex.globalCompositeOperation = "source-over";
  ex.clearRect(0, 0, W, H);
  ex.drawImage(imgAll, 0, 0, W, H);
  ex.globalCompositeOperation = "destination-in";
  ex.drawImage(mask, 0, 0);
  ex.globalCompositeOperation = "source-over";
}

function draw(){
  x.clearRect(0, 0, W, H);
  x.drawImage(imgBase, 0, 0);
  x.drawImage(cutOff, 0, 0);
  if (litLayer) x.drawImage(litLayer, 0, 0);
}

function snapLight(){
  if (!level || level.length !== win.length) level = new Float32Array(win.length);
  for (let i = 0; i < level.length; i++) level[i] = targetLevel(i);
  rebuildLitLayer();
  draw();
}

function lightFrame(now){
  lightRaf = 0;
  if (!level) return;
  if (!lightLast) lightLast = now;
  const step = Math.min(64, now - lightLast) / LIGHT_FADE_MS;
  lightLast = now;
  let dirty = false;
  for (let i = 0; i < level.length; i++){
    const tgt = targetLevel(i);
    const d = tgt - level[i];
    if (Math.abs(d) < 0.001){ if (level[i] !== tgt){ level[i] = tgt; dirty = true; } continue; }
    dirty = true;
    level[i] = Math.abs(d) <= step ? tgt : level[i] + Math.sign(d) * step;
  }
  if (dirty){
    rebuildLitLayer();
    draw();
    lightRaf = requestAnimationFrame(lightFrame);
  } else {
    lightLast = 0;
  }
}

function requestLightFade(){
  if (!level){ snapLight(); return; }
  if (!lightRaf){ lightLast = 0; lightRaf = requestAnimationFrame(lightFrame); }
}

(async function(){
  const [base, off, all] = await Promise.all([load(SRC_BASE), load(SRC_OFF), load(SRC_ALL)]);
  imgBase = base; imgOff = off; imgAll = all;
  W = base.naturalWidth; H = base.naturalHeight;
  c.width = W; c.height = H;

  poly = ZONES.map(p => p.map(([a, b]) => [a * W, b * H]));
  buildCells();
  over = new Array(win.length).fill(null);

  const mask = cv(W, H);
  fillPolys(mask.getContext("2d"), poly);
  const soft = cv(W, H), sx = soft.getContext("2d");
  sx.filter = `blur(${FEATHER}px)`; sx.drawImage(mask, 0, 0); sx.filter = "none";
  cutOff = cutTo(off, soft);
  cutAll = cutTo(all, soft);

  $("boot").remove();
  snapLight();
  housesStart();
  applyLayout(0);
})();

  //   but the column needs β. Skew closes the gap:

const houseOn = HOUSES.map(() => true);
let housePhase = false;       // one step puts a window out, the next lights one

(function buildTabletUI(){
  const ui = $("ui");
  TSW.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "trow";
    row.style.left = s.l + "%";
    row.style.top = s.t + "%";
    row.style.transform = `rotate(${s.a}deg) skewX(${s.sk}deg)`;
    const id = "tsw-" + i;
    const b = document.createElement("button");
    b.className = "tsw"; b.type = "button"; b.id = id;
    b.setAttribute("role", "switch"); b.setAttribute("aria-checked", "true");
    b.setAttribute("aria-label", HOUSE_NAMES[i]);
    const lab = document.createElement("label");
    lab.className = "tlab";
    lab.dataset.text = HOUSE_NAMES[i];
    lab.textContent = HOUSE_NAMES[i];
    // whole padded row is the hit target (gap + padding), not only the controls
    row.addEventListener("click", () => {
      setHouse(i, b.getAttribute("aria-checked") !== "true");
    });
    row.append(b, lab);
    ui.appendChild(row);
  });
  // mic in the lower-right of the screen, same plane as the rows
  const micWrap = document.createElement("div");
  micWrap.className = "tmic";
  micWrap.style.left = "50%";
  micWrap.style.top = "21%";
  const mic = document.createElement("img");
  mic.src = "../img/intro/mic_large.png";
  mic.alt = "";
  const caption = document.createElement("div");
  caption.className = "mic-caption mic-caption--inline is-hidden";
  caption.setAttribute("aria-live", "polite");
  caption.innerHTML = '<span class="mic-typed-text"></span><span class="mic-caret" aria-hidden="true">|</span>';
  micWrap.append(mic, caption);
  ui.appendChild(micWrap);

  // --mic = glow strength (JS); --gr/gg/gb = glow color (CSS, blue↔yellow on .is-live)
  const MIC_HOVER = 1.2;
  const MIC_TWEEN = 750;
  let micVal = 0;
  let micMode = "idle";
  let micTween = null;
  let micRaf = 0;

  const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const applyMic = (v) => {
    micVal = v;
    micWrap.style.setProperty("--mic", String(v));
  };
  const micFrame = (now) => {
    micRaf = 0;
    if (micMode !== "tween" || !micTween) return;
    const t = Math.min(1, (now - micTween.t0) / MIC_TWEEN);
    applyMic(micTween.from + (micTween.to - micTween.from) * easeInOut(t));
    if (t >= 1) {
      micTween = null;
      micMode = "idle";
      return;
    }
    micRaf = requestAnimationFrame(micFrame);
  };
  const tweenTo = (to) => {
    micMode = "tween";
    micTween = { from: micVal, to, t0: performance.now() };
    if (!micRaf) micRaf = requestAnimationFrame(micFrame);
  };

  micWrap.addEventListener("mouseenter", () => {
    if (!micWrap.classList.contains("is-live")) tweenTo(MIC_HOVER);
  });
  micWrap.addEventListener("mouseleave", () => {
    if (!micWrap.classList.contains("is-live")) tweenTo(0);
  });

    const on = micWrap.classList.toggle("is-live");

    }
  });
  micWrap.setAttribute("role", "button");
  micWrap.setAttribute("aria-pressed", "false");
  micWrap.setAttribute("aria-label", "Микрофон");
})();

/* ---- one demo per building, driven by the tablet switches ----
   off means the building goes dark; on means it runs the same blink as the global demo,
   but only inside its own zones. The page-wide demo takes the stage when it is running. */
const houseCells = h => HOUSES[h].flatMap(z => zoneCells(z));

function rebuildPool(){
  pool = [];
  HOUSES.forEach((_, h) => { if (houseOn[h]) pool.push(...houseCells(h)); });
}
// the period is per switched-on building: N buildings give N switches per rateMs.
// Which window moves is drawn from the shared pool, so a bigger building gets its share.
function houseArm(){
  clearInterval(houseTimer); houseTimer = null;
  const live = houseOn.filter(Boolean).length;
  if (!live || !pool.length) return;
  houseTimer = setInterval(housesTick, Math.max(25, rateMs / live));
}
function lightHalf2(cells){
  for (const i of cells) over[i] = false;
  for (const i of shuffled(cells).slice(0, Math.max(1, Math.round(cells.length / 2)))) over[i] = true;
}
function applyHouseState(h){
  const cells = houseCells(h);
  if (houseOn[h]) lightHalf2(cells); else for (const i of cells) over[i] = false;
}
function housesApply(h){
  applyHouseState(h); rebuildPool(); houseArm();
  requestLightFade();
}
function housesTick(){
  const lit = [], dark = [];
  for (const i of pool) (over[i] ? lit : dark).push(i);
  const p = housePhase ? lit : dark;
  if (p.length) over[p[Math.random() * p.length | 0]] = !housePhase;
  housePhase = !housePhase;
  requestLightFade();
}
function housesStart(){
  HOUSES.forEach((_, h) => applyHouseState(h));
  rebuildPool(); houseArm();
  requestLightFade();
}
function housesStop(){ clearInterval(houseTimer); houseTimer = null; }

/* ---- mic voice demo (maket screen-3 typewriter → house / floor / flat) ----
   Each zone grid is row-major: rows = floors (row 0 at the top of the facade),
   cols = windows along a floor. Floor 1 = ground = last row. */
const VOICE_TYPE_MS = 65;
const VOICE_AFTER_PHRASE_MS = 1200;
const VOICE_HOLD_MS = 3000;
const VOICE_DELETE_MS = 350;

function cellsOnZoneFloor(z, floor1){
  const g = grids[z];
  if (!g || !span[z]) return [];
  const nrows = g.rows.length, ncols = g.cols.length;
  const rowIdx = nrows - floor1;
  if (rowIdx < 0 || rowIdx >= nrows) return [];
  const start = span[z][0];
  const out = [];
  for (let c = 0; c < ncols; c++) out.push(start + rowIdx * ncols + c);
  return out;
}
function floorCells(floor1){
  const out = [];
  for (let z = 0; z < grids.length; z++) out.push(...cellsOnZoneFloor(z, floor1));
  return out;
}
function flatCells(z, floor1, col0, col1){
  const g = grids[z];
  if (!g || !span[z]) return [];
  const nrows = g.rows.length, ncols = g.cols.length;
  const rowIdx = nrows - floor1;
  if (rowIdx < 0 || rowIdx >= nrows) return [];
  const start = span[z][0];
  const out = [];
  for (let c = Math.max(0, col0); c <= col1 && c < ncols; c++) out.push(start + rowIdx * ncols + c);
  return out;
}

function majestyFloorCells(floor1){
  // third Majesty facade is drawn one storey higher than the first two
  return HOUSES[2].flatMap((z, i) => cellsOnZoneFloor(z, floor1 + (i === 2 ? 1 : 0)));
}

  { phrase: "turn on 7 floor", cells: () => majestyFloorCells(7), house: 2 },
  { phrase: "turn on flat 27", cells: () => flatCells(4, 2, 0, 2), house: 2 },
  { phrase: "turn on flat 99", cells: () => flatCells(6, 9, 0, 2), house: 2 }
];

let voiceRunning = false;
let voicePhraseIndex = 0;
let voiceTypedLen = 0;
let voiceTimers = [];
let voiceSaved = null; // { over, houseOn }

function voiceClearTimers(){
  while (voiceTimers.length) clearTimeout(voiceTimers.pop());
}
function voiceSchedule(fn, ms){
  const id = setTimeout(fn, ms);
  voiceTimers.push(id);
  return id;
}
function voiceSyncSwitches(){
  const switches = $("ui").querySelectorAll(".tsw");
  HOUSES.forEach((_, i) => {
    if (switches[i]) switches[i].setAttribute("aria-checked", String(!!houseOn[i]));
  });
}
function voiceLightCells(cells, soleHouse){
  for (let i = 0; i < over.length; i++) over[i] = false;
  const set = new Set(cells);
  for (const i of cells) over[i] = true;
  if (soleHouse != null) {
    HOUSES.forEach((_, i) => { houseOn[i] = (i === soleHouse); });
  } else {
    HOUSES.forEach((_, h) => {
      houseOn[h] = houseCells(h).some(i => set.has(i));
    });
  }
  voiceSyncSwitches();
  requestLightFade();
}
function voiceTick(caption){
  if (!voiceRunning) return;
  const typed = caption.querySelector(".mic-typed-text");
  const cmd = VOICE_CMDS[voicePhraseIndex];
  voiceTypedLen = Math.min(voiceTypedLen + 1, cmd.phrase.length);
  if (typed) typed.textContent = cmd.phrase.slice(0, voiceTypedLen);
  if (voiceTypedLen < cmd.phrase.length){
    voiceSchedule(() => voiceTick(caption), VOICE_TYPE_MS);
    return;
  }
  voiceSchedule(() => {
    if (!voiceRunning) return;
    voiceLightCells(cmd.cells(), cmd.house);
    voiceSchedule(() => {
      if (!voiceRunning) return;
      voiceTypedLen = 0;
      if (typed) typed.textContent = "";
      voiceSchedule(() => {
        if (!voiceRunning) return;
        voicePhraseIndex = (voicePhraseIndex + 1) % VOICE_CMDS.length;
        voiceTick(caption);
      }, VOICE_DELETE_MS);
    }, VOICE_HOLD_MS);
  }, VOICE_AFTER_PHRASE_MS);
}
function startMicVoice(caption){
  if (voiceRunning) return;
  voiceRunning = true;
  housesStop();
  $("ui").classList.add("is-voice");
  voiceSaved = { over: over.slice(), houseOn: houseOn.slice() };
  voicePhraseIndex = 0;
  voiceTypedLen = 0;
  voiceClearTimers();
  caption.classList.remove("is-hidden");
  const typed = caption.querySelector(".mic-typed-text");
  if (typed) typed.textContent = "";
  voiceTick(caption);
}
function stopMicVoice(caption){
  voiceRunning = false;
  voiceClearTimers();
  $("ui").classList.remove("is-voice");
  caption.classList.add("is-hidden");
  const typed = caption.querySelector(".mic-typed-text");
  if (typed) typed.textContent = "";
  if (voiceSaved){
    over = voiceSaved.over.slice();
    voiceSaved.houseOn.forEach((on, i) => { houseOn[i] = on; });
    voiceSaved = null;
    voiceSyncSwitches();
  }
  rebuildPool();
  houseArm();
  requestLightFade();
}

/* ---- scene layout + parallax ----
   Modes (html[data-layout] / data-fit):
     desktop + contain — ≥1150: canvas fits wrap; parallax
     desktop + crop    — 700–1149: canvas keeps ref height, side-crop; parallax
     phone             — <700: full-bleed mobile
   Tablet width: ≥1440 proportional to canvas; 1440→1150 frozen at MacBook absolute;
   below 1150 eases down to 68% of 1150. */
const TILT = 10 * Math.PI / 180;
let lastU = 0;
const BACK = 0.10, FRONT = 0.30;
const FRONT_ZOOM = 0.10;
const FRONT_OFF = 0.15;
const REF_W = 1150;
const MAC_W = 1440;           // MacBook reference — optimal tablet size
const PHONE_MAX = 700;
const TABLET_RATIO = 0.68;
/* Short landscape (phones ~844×390): width alone would pick desktop — also gate on height. */
const PHONE_LANDSCAPE_MAX_H = 500;
/* dark marble plane top edge: measured angle, mid-Y keeps height placement */
const PLANE_ANGLE = -16.56 * Math.PI / 180;
const PLANE_MID_Y = 0.587;
const PLANE_LIFT = 70; // px up at ~desktop canvas height; scales with cr.height
const PLANE_LIFT_REF_H = 720; // canvas height the 70px lift was tuned against
let layoutMode = "";
let layoutFit = "";

function isPhoneViewport(){
  if (innerWidth < PHONE_MAX) return true;
  // same idea as maket compact: landscape + short viewport
  return innerHeight <= PHONE_LANDSCAPE_MAX_H && innerWidth > innerHeight;
}
function detectLayoutMode(){
  return isPhoneViewport() ? "phone" : "desktop";
}
function detectFit(){
  if (isPhoneViewport()) return "";
  return innerWidth < REF_W ? "crop" : "contain";
}
function isPhoneLayout(){ return layoutMode === "phone"; }
function isDesktopLayout(){ return layoutMode === "desktop"; }

function clearSceneInline(){
  const wrap = $("tabletWrap");
  const bleed = $("belowTablet");
  ["left","top","bottom","right","width","height","transform","transformOrigin","maxWidth","maxHeight","margin"].forEach(p => {
    c.style[p] = "";
    wrap.style[p] = "";
  });
  bleed.style.top = "";
  bleed.style.left = "";
  bleed.style.right = "";
  bleed.style.width = "";
  bleed.style.clipPath = "";
  bleed.style.background = "";
  bleed.style.display = "";
  c.style.transform = "";
  wrap.style.transform = "";
}

function updateFloorExt(){
  /* Continues the dark marble parallelogram from the photo to the viewport bottom:
     slanted top at PLANE_ANGLE; gradient TR #16171b → BL #000.
     Edge is a line in image space; sample at viewport L/R so it tracks parallax.
     Phone landscape: canvas is narrower than the viewport — sample/clip to the
     canvas box so the edge is not extrapolated sky-high off-image. */
  const el = $("belowTablet");
  const cr = c.getBoundingClientRect();
  if (!cr.height){ el.style.display = "none"; return; }
  const aspect = cr.width / cr.height;
  const dy = Math.abs(Math.tan(PLANE_ANGLE)) * aspect; // ΔY across image width
  // Keep the visual lift proportional to the photo; fixed 70px is too much on short landscape
  const lift = PLANE_LIFT * Math.min(1.15, Math.max(0.25, cr.height / PLANE_LIFT_REF_H));
  const phoneLandscape = layoutMode === "phone"
    && document.documentElement.dataset.orient === "landscape";
  const x0 = phoneLandscape ? cr.left : 0;
  const x1 = phoneLandscape ? cr.right : innerWidth;
  // image-space edge: y_norm(x) = MID + (x - 0.5) * dy  (left higher, right lower)
  const yAt = (clientX) => {
    const x = (clientX - cr.left) / cr.width;
    return cr.top + (PLANE_MID_Y + (x - 0.5) * dy) * cr.height - lift;
  };
  const yL = yAt(x0);
  const yR = yAt(x1);
  const top = Math.min(yL, yR, innerHeight);
  if (top >= innerHeight - 0.5){ el.style.display = "none"; return; }
  el.style.display = "block";
  if (phoneLandscape){
    el.style.left = cr.left + "px";
    el.style.width = cr.width + "px";
    el.style.right = "auto";
  } else {
    el.style.left = "0";
    el.style.right = "0";
    el.style.width = "";
  }
  el.style.bottom = "0";
  el.style.top = top + "px";
  el.style.background = "linear-gradient(to bottom left, #16171b 0%, #000 100%)";
  const h = innerHeight - top;
  const pL = Math.max(0, Math.min(100, ((yL - top) / h) * 100));
  const pR = Math.max(0, Math.min(100, ((yR - top) / h) * 100));
  el.style.clipPath = "polygon(0% " + pL + "%, 100% " + pR + "%, 100% 100%, 0% 100%)";
}

function tabletWidthForViewport(canvasW){
  // ≥ MAC_W: same proportions as MacBook (68% of canvas)
  // MAC_W → REF_W: freeze absolute MacBook size
  // REF_W → PHONE_MAX: ease down to the crop-fixed size (68% of REF_W)
  const tMac = MAC_W * TABLET_RATIO;
  const tRef = REF_W * TABLET_RATIO;
  const w = innerWidth;
  if (w >= MAC_W) return canvasW * TABLET_RATIO;
  if (w >= REF_W) return tMac;
  const t = (REF_W - w) / (REF_W - PHONE_MAX);
  return tMac + (tRef - tMac) * Math.min(1, Math.max(0, t));
}

function syncTabletWidthFromCanvas(){
  const root = document.documentElement;
  if (layoutMode === "phone") return; // phone CSS owns --tablet-w
  const cw = c.offsetWidth || innerWidth;
  root.style.setProperty("--canvas-w", cw + "px");
  root.style.setProperty("--tablet-w", tabletWidthForViewport(cw) + "px");
}

function layoutPhone(wrap, bleed){
  document.documentElement.style.removeProperty("--canvas-w");
  document.documentElement.style.removeProperty("--tablet-w");
  document.documentElement.style.removeProperty("--stage-h");
  const landscape = matchMedia("(orientation: landscape)").matches
    || (innerWidth > innerHeight && innerHeight <= PHONE_LANDSCAPE_MAX_H);
  document.documentElement.dataset.orient = landscape ? "landscape" : "portrait";
  void wrap.offsetWidth;
  const s = getComputedStyle(document.documentElement).getPropertyValue("--tablet-scale").trim() || "1.18";
  const sNum = parseFloat(s) || 1.18;
  const th = wrap.offsetHeight * sNum;
  wrap.style.right = "auto";
  wrap.style.bottom = "auto";
  wrap.style.transformOrigin = "center center";
  if (landscape){
    // Canvas is taller than the viewport (width-cover, top-aligned) — do not
    // use canvas mid-Y or the tablet sits below the fold.
    wrap.style.left = (innerWidth / 2) + "px";
    wrap.style.top = Math.min(innerHeight - th * 0.38, innerHeight * 0.78) + "px";
  } else {
    const cr = c.getBoundingClientRect();
    wrap.style.left = (cr.left + cr.width / 2) + "px";
    wrap.style.top = (cr.top + cr.height / 2 + th / 3) + "px";
  }
  wrap.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  updateFloorExt();
}

function layoutDesktopStage(){
  const root = document.documentElement;
  document.documentElement.dataset.orient = "";
  const aspect = (W && H) ? (W / H) : (c.naturalWidth && c.naturalHeight ? c.naturalWidth / c.naturalHeight : 16 / 9);
  const imgAspect = (W && H) ? W / H : aspect;

  if (layoutFit === "crop"){
    let stageH = REF_W / imgAspect;
    if (stageH > innerHeight) stageH = innerHeight;
    root.style.setProperty("--stage-h", stageH + "px");
    root.style.setProperty("--canvas-aspect", String(imgAspect));
  } else {
    root.style.removeProperty("--stage-h");
    root.style.removeProperty("--canvas-aspect");
  }
  void c.offsetWidth;
  syncTabletWidthFromCanvas();
  void $("tabletWrap").offsetWidth;
}

function applyParallax(u){
  const wrap = $("tabletWrap");
  u = lastU = Math.max(-1, Math.min(1, u));
  const ax = Math.cos(TILT), ay = Math.sin(TILT);
  const cw = c.offsetWidth, ch = c.offsetHeight;
  const tw = wrap.offsetWidth, th = wrap.offsetHeight;
  const b = u * BACK / 2 * cw, f = u * FRONT / 2 * tw;
  const ox = -FRONT_OFF * tw, oy = FRONT_OFF * th;

  if (layoutFit === "crop"){
    c.style.transform =
      "translateX(-50%) translate(" + (b * ax).toFixed(1) + "px, " + (b * ay).toFixed(1) + "px) scale(" + (1 + BACK) + ")";
  } else {
    c.style.transform =
      "translate(" + (b * ax).toFixed(1) + "px, " + (b * ay).toFixed(1) + "px) scale(" + (1 + BACK) + ")";
  }

  // tablet at canvas layout box bottom-left (ignore parallax scale on measure)
  let baseLeft, baseBottom;
  if (layoutFit === "crop"){
    // canvas is centered and wider than the viewport — keep tablet on the left
    // edge of the screen, same resting place as at the 1150 contain breakpoint
    baseLeft = 0;
    baseBottom = Math.max(0, innerHeight - ch);
  } else {
    const wr = $("wrap").getBoundingClientRect();
    baseLeft = wr.left + (wr.width - cw) / 2;
    baseBottom = Math.max(0, innerHeight - (wr.top + (wr.height - ch) / 2 + ch));
  }
  wrap.style.left = baseLeft + "px";
  wrap.style.bottom = baseBottom + "px";
  wrap.style.top = "auto";
  wrap.style.right = "auto";
  wrap.style.transformOrigin = "left bottom";
  const k = 1 + FRONT_ZOOM * (u + 1) / 2;
  wrap.style.transform =
    "translate(" + (ox + f * ax).toFixed(1) + "px, " + (oy + f * ay).toFixed(1) + "px) scale(" + k.toFixed(3) + ")";
  updateFloorExt();
}

function applyLayout(u){
  const wrap = $("tabletWrap");
  const bleed = $("belowTablet");
  const mode = detectLayoutMode();
  const fit = detectFit();
  const modeChanged = mode !== layoutMode || fit !== layoutFit;

  clearSceneInline();
  layoutMode = mode;
  layoutFit = fit;
  document.documentElement.dataset.layout = mode;
  if (fit) document.documentElement.dataset.fit = fit;
  else delete document.documentElement.dataset.fit;

  void document.documentElement.offsetWidth; // apply CSS before measuring

  if (modeChanged) lastU = 0;

  if (mode === "phone"){
    lastU = 0;
    layoutPhone(wrap, bleed);
    return;
  }

  layoutDesktopStage();
  applyParallax(modeChanged ? 0 : (u != null ? u : lastU));
}

function parallax(u){
  // live pointer tracking on desktop — no full reset
  if (layoutMode !== "desktop"){
    applyLayout(u);
    return;
  }
  applyParallax(u);
}

function isMobileLayout(){ return isPhoneLayout(); }
// the pointer counts as "on the tablet" only where the artwork is actually opaque,
// so the transparent corners of its box still drive the parallax
let alphaMap = null;
(function sampleTablet(){
  // Data-URI alpha: file:// taints getImageData when drawing local tablet.webp.
  const grab = () => load(TABLET_ALPHA_SRC).then(img => {
    const w = img.naturalWidth, h = img.naturalHeight;
    const t = cv(w, h), tx = t.getContext("2d");
    tx.drawImage(img, 0, 0);
    alphaMap = { w, h, data: tx.getImageData(0, 0, w, h).data };
    applyLayout(lastU);
  }).catch(() => { alphaMap = null; applyLayout(lastU); });
  grab();
})();
function overTablet(e){
  const r = $("tabletWrap").getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return false;
  if (!alphaMap) return false;
  const ix = Math.floor((e.clientX - r.left) / r.width * alphaMap.w);
  const iy = Math.floor((e.clientY - r.top) / r.height * alphaMap.h);
  return alphaMap.data[(iy * alphaMap.w + ix) * 4 + 3] > 40;   // frozen only over solid pixels
}
addEventListener("pointermove", e => {
  if (layoutMode !== "desktop") return;
  const on = overTablet(e);
  $("tabletWrap").classList.toggle("is-over", on);
  if (on) return;
  parallax(1 - e.clientX / innerWidth * 2);
});
addEventListener("pointerleave", () => {
  $("tabletWrap").classList.remove("is-over");
  if (layoutMode === "desktop") parallax(0);
});
addEventListener("resize", () => applyLayout(lastU));
matchMedia("(orientation: landscape)").addEventListener("change", () => applyLayout(lastU));

/* ---- picking ---- */
function toImg(e){
  const r = c.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
function inPoly(px, py, p){
  let hit = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++){
    const ax = p[i][0], ay = p[i][1], bx = p[j][0], by = p[j][1];
    if ((ay > py) !== (by > py) && px < (bx - ax) * (py - ay) / (by - ay) + ax) hit = !hit;
  }
  return hit;
}
function pickWindow(pt){
  for (let i = 0; i < win.length; i++) if (inPoly(pt[0], pt[1], win[i])) return i;
  return -1;
}

c.addEventListener("pointermove", e => {
  if (!W) return;
  c.style.cursor = (!overTablet(e) && pickWindow(toImg(e)) >= 0) ? "pointer" : "default";
});

c.addEventListener("click", e => {
  if (overTablet(e)) return;           // the tablet blocks the model where it is actually opaque
  const i = pickWindow(toImg(e)); if (i < 0) return;
  const light = lightAll;
  const next = !(over[i] === null ? light : over[i]);
  over[i] = (next === light) ? null : next;
  requestLightFade();
});

/* ---- demo mode ---- */
function shuffled(list){                       // Fisher-Yates, so every item has the same odds
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.random() * (i + 1) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function zoneCells(z){ return Array.from({ length: span[z][1] }, (_, k) => span[z][0] + k); }
const stage = () => soloOn ? zoneCells(soloZone) : over.map((_, i) => i);

function lightHalf(list){
  over.fill(false);
  for (const i of shuffled(list).slice(0, Math.max(1, Math.round(list.length / 2)))) over[i] = true;
}
function soloNext(){
  soloZone = soloOrder[soloPos++ % soloOrder.length];
  lightHalf(zoneCells(soloZone));
  requestLightFade();
}
let demoPhase = false;         // one step puts a window out, the next lights one
function demoTick(){
  const lit = [], dark = [];
  for (const i of stage()) (over[i] ? lit : dark).push(i);
  const pool = demoPhase ? lit : dark;
  if (pool.length) over[pool[Math.random() * pool.length | 0]] = !demoPhase;
  demoPhase = !demoPhase;
  requestLightFade();
}
function arm(){
  clearInterval(demoTimer);
  demoTimer = setInterval(demoTick, rateMs);
}
function demoRestart(){
  clearInterval(soloTimer); soloTimer = null;
  over = new Array(win.length).fill(false);
  if (soloOn){
    soloOrder = shuffled(grids.map((_, z) => z)); soloPos = 0;
    soloNext();
    soloTimer = setInterval(soloNext, 6000);   // one house holds the stage for six seconds
  } else {
    lightHalf(over.map((_, i) => i));
    requestLightFade();
  }
  arm();
}
function demoStart(){
  housesStop();
  demoSaved = over.slice();
  demoRestart();
}
function demoStop(){
  clearInterval(demoTimer); demoTimer = null;
  clearInterval(soloTimer); soloTimer = null;
  demoSaved = null;
  housesStart();
}
/* ---- control API ----
   Everything the bottom bar used to do, callable from anywhere. Each entry is also
   exposed on window.maket, so the page can be driven from a console, a parent frame,
   or whatever UI is put in front of it later.

   The seven switches drawn on the tablet already call setHouse() on their own;
   nothing else is wired up by default. */

// Master light. Lights or darkens every window at once, in every zone.
// Per-window clicks and the demos keep working on top of it.
function setLight(on){
  lightAll = !!on;
  requestLightFade();
}

// Page-wide demo: half the windows lit, then one window changing per tick.
// Takes the stage from the per-building demo while it runs, and hands it back on stop.
function setDemo(on){
  on = !!on;
  if (on === demoOn) return;
  demoOn = on;
  on ? demoStart() : demoStop();
}

// Within the page-wide demo: run one building at a time, six seconds each,
// with the rest of the estate dark. Ignored while the demo is off.
function setSolo(on){
  soloOn = !!on;
  if (demoTimer || soloTimer) demoRestart();
}

// Switching period in ms, per switched-on building: 3000 means one window
// per three seconds per building, so N buildings give N switches per 3 s.
// Clamped to 25 ms at the fast end so the masks can keep up. Applies immediately.
function setRate(ms){
  rateMs = Math.max(100, Math.min(3000, +ms || 3000));
  if (demoTimer) arm();
  if (houseTimer) houseArm();
}

// One building on or off, 0..6, in the order of the tablet switches top to bottom.
// Off darkens it; on gives it half its windows lit and puts it back in the demo pool.
function setHouse(i, on){
  if (voiceRunning) return;
  if (i < 0 || i >= HOUSES.length) return;
  houseOn[i] = !!on;
  const b = $("ui").querySelectorAll(".tsw")[i];
  if (b) b.setAttribute("aria-checked", String(!!on));
  if (!demoTimer && !soloTimer) housesApply(i);
}

// One window on or off by its flat index, 0..506 — the same order as
// the zones in ZONES and, inside a zone, its cells row by row.
// Pass null to hand the window back to the master light.
function setWindow(i, on){
  if (i < 0 || i >= win.length) return;
  over[i] = on === null ? null : !!on;
  requestLightFade();
}

// Deal a fresh random half in every switched-on building, and stop the page-wide demo.
function shuffle(){
  if (demoOn) setDemo(false);
  housesStart();
}


/* bridge gestures to parent so maket scroll-snap keeps working over the intro iframe */
addEventListener("wheel", e => {
  try {
    parent.postMessage({
      type: "maket-intro-wheel",
      deltaY: e.deltaY,
      deltaX: e.deltaX,
      deltaMode: e.deltaMode,
      timeStamp: e.timeStamp
    }, "*");
  } catch (_) {}
}, { passive: true });

let __introTouch = null;
addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { __introTouch = null; return; }
  __introTouch = { y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
addEventListener("touchend", e => {
  if (!__introTouch || !e.changedTouches.length) { __introTouch = null; return; }
  const dy = __introTouch.y - e.changedTouches[0].clientY;
  const dt = Date.now() - __introTouch.t;
  __introTouch = null;
  if (dt > 900 || Math.abs(dy) < 70) return;
  try {
    parent.postMessage({ type: "maket-intro-swipe", dir: dy > 0 ? 1 : -1 }, "*");
  } catch (_) {}
}, { passive: true });

window.maket = { setLight, setDemo, setSolo, setRate, setHouse, setWindow, shuffle,
                 HOUSES, get state(){ return { lightAll, demoOn, soloOn, rateMs,
                   houses: houseOn.slice(), windows: over.slice() }; } };

</script>
