<!DOCTYPE html>
<html lang="{{ or site.Language.Lang "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="site-main{{ if or .IsHome (eq .Layout "about") }} site-main--wide{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ block "secondary" . }}{{ end }}
  {{ partial "footer.html" . }}
  <script src="{{ "js/theme.js" | relURL }}"></script>
</body>
</html>
