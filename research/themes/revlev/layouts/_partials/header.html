{{- $isAbout := eq .Layout "about" -}}
{{- $isHome := .IsHome -}}
<header class="site-header">
  <div class="shell site-header-inner">
    <a class="header-back" href="{{ site.Params.mainSite }}">{{ site.Params.author }}</a>
    <div class="header-brand">
      <a class="header-title{{ if $isHome }} is-active{{ end }}" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <a class="header-link header-about{{ if $isAbout }} is-active{{ end }}" href="{{ "about/" | relURL }}">About</a>
    </div>
    <div class="header-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">
        <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"></path>
        </svg>
        <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
      <nav class="header-nav" aria-label="Social">
        <a class="header-link" href="https://www.linkedin.com/in/teterevlev/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a class="header-link" href="https://github.com/teterevlev" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="header-link" href="https://t.me/oleg_teterevlev" target="_blank" rel="noopener noreferrer">Telegram</a>
      </nav>
    </div>
  </div>
</header>
