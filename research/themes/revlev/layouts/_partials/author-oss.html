{{- $a := hugo.Data.author -}}
{{- $oss := $a.open_source -}}
{{- $ext := `<svg class="ext-icon" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5H3.5v9h9v-3"/><path d="M9.5 2.5h4v4M13.5 2.5 7 9"/></svg>` -}}
<div class="author-tile author-tile-c">
  <p class="author-eyebrow">{{ $oss.eyebrow }}</p>
  <p class="author-oss-title">
    <a href="{{ $oss.pypi }}" target="_blank" rel="noopener noreferrer">{{ $oss.title }}{{ $ext | safeHTML }}</a>
    <span class="author-oss-github">(<a href="{{ $oss.github }}" target="_blank" rel="noopener noreferrer">GitHub{{ $ext | safeHTML }}</a>)</span>
  </p>
  <p class="author-oss-more">
    <a href="{{ $oss.article | relURL }}">Read more →</a>
  </p>
</div>
