{{ define "main" }}
<article class="post">
  <header class="post-header">
    <p class="post-meta">
      <a href="{{ "/" | relURL }}">Research</a>
      <span aria-hidden="true">/</span>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    </p>
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Params.summary }}
    <p class="page-lead">{{ . }}</p>
    {{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  {{ if eq .Section "posts" }}
  {{ partial "author-card.html" . }}
  {{ end }}
</article>
{{ end }}
