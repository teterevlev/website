<svg xmlns="http://www.w3.org/2000/svg" class="fig-svg" viewBox="0 60 720 290" width="720" height="290" role="img" aria-labelledby="fig4-lifecycle-title fig4-lifecycle-desc">
  <title id="fig4-lifecycle-title">Lifecycle state machine</title>
  <desc id="fig4-lifecycle-desc">Managed-node states with the safety role of each transition: the heartbeat starts at configure and is released at cleanup, so every state in which the process is alive is observable. A dashed red edge shows the self-triggered deactivate on fault timeout; a dashed grey edge shows that the supervisor issues every transition.</desc>
  <defs>
    <marker id="f4-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fg-ah" d="M2 1L8 5L2 9"/></marker><marker id="f4-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fg-alert-ah" d="M2 1L8 5L2 9"/></marker><marker id="f4-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fg-auth-ah" d="M2 1L8 5L2 9"/></marker>
    <style>
      .fg-t   { font-family: var(--font, "Inter", -apple-system, "Segoe UI", sans-serif); }
      .fg-hd  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .fg-hd2 { font-size: 14px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .fg-sb  { font-size: 11.5px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .fg-lbl { font-size: 12px; font-weight: 400; }
      .fg-ink   { fill: var(--ink, #1A1D23); }
      .fg-muted { fill: var(--graphite, #5C6370); }
      .fg-edge  { fill: none; stroke: var(--slate, #8A8F98); stroke-width: 1.3; }
      .fg-ah    { fill: none; stroke: var(--slate, #8A8F98); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fg-inner { fill: var(--white, #FFFFFF); stroke-width: 1.2; }
      .fg-box   { stroke-width: 1.2; }

      /* protection layers, triggers, end states */
      .fg-k-neutral   .fg-box    { fill: var(--ash, #F2F3F5);        stroke: var(--graphite, #5C6370); }
      .fg-k-neutral   .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-neutral   .fg-accent { fill: var(--graphite, #5C6370); }
      /* supervisor, active, ground robot */
      .fg-k-blue      .fg-box    { fill: var(--blue-pale, #EDF2FF);  stroke: var(--blue, #4A6CF7); }
      .fg-k-blue      .fg-strong { fill: var(--blue-ink, #1B2F80); }
      .fg-k-blue      .fg-accent { fill: var(--blue-deep, #2A4AD4); }
      /* soft class, inactive */
      .fg-k-bluelight .fg-box    { fill: var(--white, #FFFFFF);      stroke: var(--blue-light, #B4C6FC); }
      .fg-k-bluelight .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-bluelight .fg-accent { fill: var(--blue-deep, #2A4AD4); }
      /* hard class, UAV */
      .fg-k-alert     .fg-box    { fill: var(--alert-pale, #FDEEEE); stroke: var(--alert, #D64545); }
      .fg-k-alert     .fg-strong { fill: var(--alert-ink, #7A1F1F); }
      .fg-k-alert     .fg-accent { fill: var(--alert-deep, #A8302F); }
      /* supervisor silent */
      .fg-k-crit      .fg-box    { fill: var(--alert-pale, #FDEEEE); stroke: var(--alert-deep, #A8302F); stroke-width: 1.8; }
      /* informational */
      .fg-k-info      .fg-box    { fill: var(--snow, #FAFBFC);       stroke: var(--smoke, #C4C8CF); }
      .fg-k-info      .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-info      .fg-accent { fill: var(--graphite, #5C6370); }

      .fg-in-blue     { stroke: var(--blue-light, #B4C6FC); }
      .fg-in-alert    { stroke: var(--alert-light, #F2BDBD); }
      .fg-in-alertS   { stroke: var(--alert, #D64545); }
      .fg-in-crit     { stroke: var(--alert-deep, #A8302F); stroke-width: 1.8; }

      .fg-alert-edge  { fill: none; stroke: var(--alert, #D64545); stroke-width: 1.4; stroke-dasharray: 6 4; }
      .fg-alert-ah    { fill: none; stroke: var(--alert, #D64545); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fg-alert-txt   { fill: var(--alert-deep, #A8302F); }
      .fg-auth-edge   { fill: none; stroke: var(--graphite, #5C6370); stroke-width: 1.2; stroke-dasharray: 5 4; }
      .fg-auth-ah     { fill: none; stroke: var(--graphite, #5C6370); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g class="fg-t fg-k-info">
    <rect class="fg-box" x="16" y="104" width="142" height="50" rx="22"/>
    <text class="fg-hd fg-ink" x="87" y="122">unconfigured</text>
    <text class="fg-sb fg-muted" x="87" y="140">no heartbeat</text>
  </g>
  <g class="fg-t fg-k-bluelight">
    <rect class="fg-box" x="248" y="104" width="168" height="50" rx="22"/>
    <text class="fg-hd fg-ink" x="332" y="122">inactive</text>
    <text class="fg-sb fg-muted" x="332" y="140">heartbeat, not acting</text>
  </g>
  <g class="fg-t fg-k-blue">
    <rect class="fg-box" x="506" y="104" width="200" height="50" rx="22"/>
    <text class="fg-hd fg-ink" x="606" y="122">active</text>
    <text class="fg-sb fg-muted" x="606" y="140">heartbeat + control cycle</text>
  </g>
  <g class="fg-t fg-k-neutral">
    <rect class="fg-box" x="268" y="290" width="128" height="48" rx="22"/>
    <text class="fg-hd fg-ink" x="332" y="307">finalized</text>
    <text class="fg-sb fg-muted" x="332" y="324">no heartbeat</text>
  </g>

  <line class="fg-edge" x1="158" y1="118" x2="246" y2="118" marker-end="url(#f4-ah)"/>
  <text class="fg-t fg-sb fg-muted" x="203" y="80">open bus, start heartbeat</text>
  <text class="fg-t fg-lbl fg-ink" x="203" y="104" text-anchor="middle">configure</text>
  <line class="fg-edge" x1="248" y1="140" x2="160" y2="140" marker-end="url(#f4-ah)"/>
  <text class="fg-t fg-lbl fg-ink" x="203" y="160" text-anchor="middle">cleanup</text>

  <line class="fg-edge" x1="416" y1="118" x2="504" y2="118" marker-end="url(#f4-ah)"/>
  <text class="fg-t fg-sb fg-muted" x="461" y="80">start control cycle</text>
  <text class="fg-t fg-lbl fg-ink" x="461" y="104" text-anchor="middle">activate</text>
  <line class="fg-edge" x1="506" y1="140" x2="418" y2="140" marker-end="url(#f4-ah)"/>
  <text class="fg-t fg-lbl fg-ink" x="461" y="160" text-anchor="middle">deactivate</text>
  <text class="fg-t fg-sb fg-muted" x="461" y="176">command safe state</text>

  <line class="fg-edge" x1="332" y1="154" x2="332" y2="288" marker-end="url(#f4-ah)"/>
  <text class="fg-t fg-lbl fg-ink" x="342" y="232">shutdown</text>

  <path class="fg-alert-edge" d="M640 154 C 640 272, 404 272, 396 158" marker-end="url(#f4-red)"/>
  <text class="fg-t fg-sb fg-alert-txt" x="566" y="262">fault timeout: self-triggered</text>

  <g class="fg-t fg-k-neutral">
    <rect class="fg-box" x="16" y="212" width="200" height="92" rx="8"/>
    <text class="fg-hd fg-ink" x="116" y="234">Supervisor authority</text>
    <text class="fg-sb fg-muted" x="116" y="256">issues every transition;</text>
    <text class="fg-sb fg-muted" x="116" y="274">arming gated on heartbeat</text>
    <text class="fg-sb fg-muted" x="116" y="290">from all required nodes</text>
  </g>
  <path class="fg-auth-edge" d="M216 246 C 268 244, 300 216, 318 158" marker-end="url(#f4-hw)"/>

</svg>
