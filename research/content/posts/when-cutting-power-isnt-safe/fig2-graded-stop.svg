<svg xmlns="http://www.w3.org/2000/svg" class="fig-svg" viewBox="0 0 680 306" width="680" height="306" role="img" aria-labelledby="fig2-graded-stop-title fig2-graded-stop-desc">
  <title id="fig2-graded-stop-title">Graded stop</title>
  <desc id="fig2-graded-stop-desc">A detected heartbeat timeout branches into three graded responses, selected by which layer went silent: lifecycle deactivate for a soft-class node, platform safe stop for a hard-class node, and the hardware fallback when the supervisor itself is silent.</desc>
  <defs>
    <marker id="f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fg-ah" d="M2 1L8 5L2 9"/></marker>
    <style>
      .fg-t   { font-family: var(--font, "Inter", -apple-system, "Segoe UI", sans-serif); }
      .fg-hd  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .fg-hd2 { font-size: 14px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .fg-sb  { font-size: 11.5px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .fg-lbl { font-size: 12px; font-weight: 400; }
      .fg-ink   { fill: var(--ink, #1A1D23); }
      .fg-muted { fill: var(--graphite, #5C6370); }
      .fg-edge  { fill: none; stroke: var(--slate, #8A8F98); stroke-width: 1.3; }
      .fg-ah    { fill: none; stroke: var(--slate, #8A8F98); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fg-inner { fill: var(--white, #FFFFFF); stroke-width: 1.2; }
      .fg-box   { stroke-width: 1.2; }

      /* protection layers, triggers, end states */
      .fg-k-neutral   .fg-box    { fill: var(--ash, #F2F3F5);        stroke: var(--graphite, #5C6370); }
      .fg-k-neutral   .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-neutral   .fg-accent { fill: var(--graphite, #5C6370); }
      /* supervisor, active, ground robot */
      .fg-k-blue      .fg-box    { fill: var(--blue-pale, #EDF2FF);  stroke: var(--blue, #4A6CF7); }
      .fg-k-blue      .fg-strong { fill: var(--blue-ink, #1B2F80); }
      .fg-k-blue      .fg-accent { fill: var(--blue-deep, #2A4AD4); }
      /* soft class, inactive */
      .fg-k-bluelight .fg-box    { fill: var(--white, #FFFFFF);      stroke: var(--blue-light, #B4C6FC); }
      .fg-k-bluelight .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-bluelight .fg-accent { fill: var(--blue-deep, #2A4AD4); }
      /* hard class, UAV */
      .fg-k-alert     .fg-box    { fill: var(--alert-pale, #FDEEEE); stroke: var(--alert, #D64545); }
      .fg-k-alert     .fg-strong { fill: var(--alert-ink, #7A1F1F); }
      .fg-k-alert     .fg-accent { fill: var(--alert-deep, #A8302F); }
      /* supervisor silent */
      .fg-k-crit      .fg-box    { fill: var(--alert-pale, #FDEEEE); stroke: var(--alert-deep, #A8302F); stroke-width: 1.8; }
      /* informational */
      .fg-k-info      .fg-box    { fill: var(--snow, #FAFBFC);       stroke: var(--smoke, #C4C8CF); }
      .fg-k-info      .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-info      .fg-accent { fill: var(--graphite, #5C6370); }

      .fg-in-blue     { stroke: var(--blue-light, #B4C6FC); }
      .fg-in-alert    { stroke: var(--alert-light, #F2BDBD); }
      .fg-in-alertS   { stroke: var(--alert, #D64545); }
      .fg-in-crit     { stroke: var(--alert-deep, #A8302F); stroke-width: 1.8; }

      .fg-alert-edge  { fill: none; stroke: var(--alert, #D64545); stroke-width: 1.4; stroke-dasharray: 6 4; }
      .fg-alert-ah    { fill: none; stroke: var(--alert, #D64545); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fg-alert-txt   { fill: var(--alert-deep, #A8302F); }
      .fg-auth-edge   { fill: none; stroke: var(--graphite, #5C6370); stroke-width: 1.2; stroke-dasharray: 5 4; }
      .fg-auth-ah     { fill: none; stroke: var(--graphite, #5C6370); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g class="fg-t fg-k-neutral">
    <rect class="fg-box" x="215" y="16" width="250" height="48" rx="8"/>
    <text class="fg-hd fg-ink" x="340" y="34">Heartbeat timeout detected</text>
    <text class="fg-sb fg-muted" x="340" y="52">which layer went silent?</text>
  </g>
  <line class="fg-edge" x1="298" y1="64" x2="124" y2="106" marker-end="url(#f2-ah)"/>
  <line class="fg-edge" x1="340" y1="64" x2="340" y2="106" marker-end="url(#f2-ah)"/>
  <line class="fg-edge" x1="382" y1="64" x2="556" y2="106" marker-end="url(#f2-ah)"/>
  <g class="fg-t fg-k-bluelight">
    <rect class="fg-box" x="16" y="110" width="208" height="70" rx="8"/>
    <text class="fg-hd fg-ink" x="120" y="132">Soft-class node</text>
    <text class="fg-sb fg-muted" x="120" y="153">layer below confirmed alive</text>
    <text class="fg-sb fg-muted" x="120" y="169">by its own heartbeat</text>
  </g>
  <g class="fg-t fg-k-alert">
    <rect class="fg-box" x="236" y="110" width="208" height="70" rx="8"/>
    <text class="fg-hd fg-ink" x="340" y="132">Hard-class node</text>
    <text class="fg-sb fg-muted" x="340" y="153">no delegate remains,</text>
    <text class="fg-sb fg-muted" x="340" y="169">supervisor still alive</text>
  </g>
  <g class="fg-t fg-k-crit">
    <rect class="fg-box" x="456" y="110" width="208" height="70" rx="8"/>
    <text class="fg-hd fg-ink" x="560" y="132">Supervisor silent</text>
    <text class="fg-sb fg-muted" x="560" y="153">entire software stack</text>
    <text class="fg-sb fg-muted" x="560" y="169">is untrustworthy</text>
  </g>
  <line class="fg-edge" x1="120" y1="180" x2="120" y2="216" marker-end="url(#f2-ah)"/>
  <line class="fg-edge" x1="340" y1="180" x2="340" y2="216" marker-end="url(#f2-ah)"/>
  <line class="fg-edge" x1="560" y1="180" x2="560" y2="216" marker-end="url(#f2-ah)"/>
  <g class="fg-t">
    <rect class="fg-inner fg-in-blue" x="16" y="220" width="208" height="70" rx="8"/>
    <text class="fg-hd2 fg-ink" x="120" y="242">Lifecycle deactivate</text>
    <text class="fg-sb fg-muted" x="120" y="263">subsystem commanded into</text>
    <text class="fg-sb fg-muted" x="120" y="279">its safe state, ordered stop</text>
  </g>
  <g class="fg-t">
    <rect class="fg-inner fg-in-alertS" x="236" y="220" width="208" height="70" rx="8"/>
    <text class="fg-hd2 fg-ink" x="340" y="242">Platform safe stop</text>
    <text class="fg-sb fg-muted" x="340" y="263">action is platform-specific,</text>
    <text class="fg-sb fg-muted" x="340" y="279">not necessarily power removal</text>
  </g>
  <g class="fg-t">
    <rect class="fg-inner fg-in-crit" x="456" y="220" width="208" height="70" rx="8"/>
    <text class="fg-hd2 fg-ink" x="560" y="242">Hardware fallback</text>
    <text class="fg-sb fg-muted" x="560" y="263">open-loop, pre-programmed,</text>
    <text class="fg-sb fg-muted" x="560" y="279">no ROS 2 involvement</text>
  </g>

</svg>
