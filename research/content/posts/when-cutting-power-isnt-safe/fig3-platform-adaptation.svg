<svg xmlns="http://www.w3.org/2000/svg" class="fig-svg" viewBox="0 0 680 302" width="680" height="302" role="img" aria-labelledby="fig3-platform-adaptation-title fig3-platform-adaptation-desc">
  <title id="fig3-platform-adaptation-title">Platform adaptation</title>
  <desc id="fig3-platform-adaptation-desc">The hard criticality class is platform-independent, but the action bound to it is not: on a ground robot it maps to removing drive power, on a UAV to a controlled descent with thrust reduced below hover rather than to zero.</desc>
  <defs>
    <marker id="f3-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="fg-ah" d="M2 1L8 5L2 9"/></marker>
    <style>
      .fg-t   { font-family: var(--font, "Inter", -apple-system, "Segoe UI", sans-serif); }
      .fg-hd  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .fg-hd2 { font-size: 14px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .fg-sb  { font-size: 11.5px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .fg-lbl { font-size: 12px; font-weight: 400; }
      .fg-ink   { fill: var(--ink, #1A1D23); }
      .fg-muted { fill: var(--graphite, #5C6370); }
      .fg-edge  { fill: none; stroke: var(--slate, #8A8F98); stroke-width: 1.3; }
      .fg-ah    { fill: none; stroke: var(--slate, #8A8F98); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fg-inner { fill: var(--white, #FFFFFF); stroke-width: 1.2; }
      .fg-box   { stroke-width: 1.2; }

      /* protection layers, triggers, end states */
      .fg-k-neutral   .fg-box    { fill: var(--ash, #F2F3F5);        stroke: var(--graphite, #5C6370); }
      .fg-k-neutral   .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-neutral   .fg-accent { fill: var(--graphite, #5C6370); }
      /* supervisor, active, ground robot */
      .fg-k-blue      .fg-box    { fill: var(--blue-pale, #EDF2FF);  stroke: var(--blue, #4A6CF7); }
      .fg-k-blue      .fg-strong { fill: var(--blue-ink, #1B2F80); }
      .fg-k-blue      .fg-accent { fill: var(--blue-deep, #2A4AD4); }
      /* soft class, inactive */
      .fg-k-bluelight .fg-box    { fill: var(--white, #FFFFFF);      stroke: var(--blue-light, #B4C6FC); }
      .fg-k-bluelight .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-bluelight .fg-accent { fill: var(--blue-deep, #2A4AD4); }
      /* hard class, UAV */
      .fg-k-alert     .fg-box    { fill: var(--alert-pale, #FDEEEE); stroke: var(--alert, #D64545); }
      .fg-k-alert     .fg-strong { fill: var(--alert-ink, #7A1F1F); }
      .fg-k-alert     .fg-accent { fill: var(--alert-deep, #A8302F); }
      /* supervisor silent */
      .fg-k-crit      .fg-box    { fill: var(--alert-pale, #FDEEEE); stroke: var(--alert-deep, #A8302F); stroke-width: 1.8; }
      /* informational */
      .fg-k-info      .fg-box    { fill: var(--snow, #FAFBFC);       stroke: var(--smoke, #C4C8CF); }
      .fg-k-info      .fg-strong { fill: var(--ink, #1A1D23); }
      .fg-k-info      .fg-accent { fill: var(--graphite, #5C6370); }

      .fg-in-blue     { stroke: var(--blue-light, #B4C6FC); }
      .fg-in-alert    { stroke: var(--alert-light, #F2BDBD); }
      .fg-in-alertS   { stroke: var(--alert, #D64545); }
      .fg-in-crit     { stroke: var(--alert-deep, #A8302F); stroke-width: 1.8; }

      .fg-alert-edge  { fill: none; stroke: var(--alert, #D64545); stroke-width: 1.4; stroke-dasharray: 6 4; }
      .fg-alert-ah    { fill: none; stroke: var(--alert, #D64545); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fg-alert-txt   { fill: var(--alert-deep, #A8302F); }
      .fg-auth-edge   { fill: none; stroke: var(--graphite, #5C6370); stroke-width: 1.2; stroke-dasharray: 5 4; }
      .fg-auth-ah     { fill: none; stroke: var(--graphite, #5C6370); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g class="fg-t fg-k-alert">
    <rect class="fg-box" x="195" y="16" width="290" height="48" rx="8"/>
    <text class="fg-hd fg-ink" x="340" y="34">Criticality: hard</text>
    <text class="fg-sb fg-muted" x="340" y="52">no delegate remains — platform-independent</text>
  </g>
  <line class="fg-edge" x1="288" y1="64" x2="175" y2="110" marker-end="url(#f3-ah)"/>
  <line class="fg-edge" x1="392" y1="64" x2="505" y2="110" marker-end="url(#f3-ah)"/>
  <text class="fg-t fg-lbl fg-muted" x="340" y="96" text-anchor="middle">mapped action is platform-specific</text>
  <g class="fg-t fg-k-blue">
    <rect class="fg-box" x="36" y="114" width="278" height="172" rx="10"/>
    <text class="fg-hd fg-ink" x="175" y="136">Ground robot</text>
    <text class="fg-sb fg-muted" x="175" y="158">de-energised state is safe</text>
    <rect class="fg-inner fg-in-blue" x="50" y="174" width="250" height="46" rx="8"/>
    <text class="fg-hd2 fg-ink" x="175" y="190">Remove drive power</text>
    <text class="fg-sb fg-muted" x="175" y="208">vehicle decelerates and stops</text>
    <rect class="fg-inner fg-in-blue" x="50" y="228" width="250" height="46" rx="8"/>
    <text class="fg-sb fg-muted" x="175" y="243">worst case: a short coast</text>
    <text class="fg-sb fg-muted" x="175" y="259">before coming to rest</text>
  </g>
  <g class="fg-t fg-k-alert">
    <rect class="fg-box" x="366" y="114" width="278" height="172" rx="10"/>
    <text class="fg-hd fg-ink" x="505" y="136">UAV</text>
    <text class="fg-sb fg-muted" x="505" y="158">de-energised state is a crash</text>
    <rect class="fg-inner fg-in-alert" x="380" y="174" width="250" height="46" rx="8"/>
    <text class="fg-hd2 fg-ink" x="505" y="190">Controlled descent</text>
    <text class="fg-sb fg-muted" x="505" y="208">thrust below hover, not to zero</text>
    <rect class="fg-inner fg-in-alert" x="380" y="228" width="250" height="46" rx="8"/>
    <text class="fg-sb fg-muted" x="505" y="243">power removal only after</text>
    <text class="fg-sb fg-muted" x="505" y="259">ground contact is confirmed</text>
  </g>

</svg>
