<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5C6370"/>
    </marker>
  </defs>
  <rect width="760" height="240" fill="#FFFFFF"/>

  <!-- Level groups -->
  <rect x="20" y="20" width="240" height="130" rx="12" fill="#FAFBFC" stroke="#E8EAED"/>
  <rect x="280" y="20" width="240" height="130" rx="12" fill="#FAFBFC" stroke="#E8EAED"/>
  <rect x="540" y="20" width="200" height="130" rx="12" fill="#FAFBFC" stroke="#E8EAED"/>
  <text x="140" y="46" text-anchor="middle" font-size="12" fill="#5C6370">Level 1 · gpt-4o-mini</text>
  <text x="400" y="46" text-anchor="middle" font-size="12" fill="#5C6370">Level 2 · gpt-5.6-terra</text>
  <text x="640" y="46" text-anchor="middle" font-size="12" fill="#5C6370">Level 3 · gpt-5.6-sol</text>

  <!-- Requests -->
  <rect x="35" y="70" width="90" height="60" rx="8" fill="#EDF2FF" stroke="#B4C6FC"/>
  <text x="80" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1D23">Request 1</text>
  <text x="80" y="114" text-anchor="middle" font-size="11" fill="#5C6370">first try</text>

  <rect x="155" y="70" width="90" height="60" rx="8" fill="#EDF2FF" stroke="#B4C6FC"/>
  <text x="200" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1D23">Request 2</text>
  <text x="200" y="114" text-anchor="middle" font-size="11" fill="#5C6370">retry + error</text>

  <rect x="295" y="70" width="90" height="60" rx="8" fill="#B4C6FC" stroke="#4A6CF7"/>
  <text x="340" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1D23">Request 3</text>
  <text x="340" y="114" text-anchor="middle" font-size="11" fill="#1B2F80">escalated</text>

  <rect x="415" y="70" width="90" height="60" rx="8" fill="#B4C6FC" stroke="#4A6CF7"/>
  <text x="460" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1D23">Request 4</text>
  <text x="460" y="114" text-anchor="middle" font-size="11" fill="#1B2F80">retry + error</text>

  <rect x="595" y="70" width="90" height="60" rx="8" fill="#4A6CF7" stroke="#2A4AD4"/>
  <text x="640" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Request 5</text>
  <text x="640" y="114" text-anchor="middle" font-size="11" fill="#EDF2FF">escalated</text>

  <!-- Arrows: each one is a failed validation -->
  <line x1="125" y1="100" x2="153" y2="100" stroke="#5C6370" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="100" x2="293" y2="100" stroke="#5C6370" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="100" x2="413" y2="100" stroke="#5C6370" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="100" x2="593" y2="100" stroke="#5C6370" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Retry budget bracket -->
  <path d="M155,162 L155,170 L685,170 L685,162" fill="none" stroke="#8A8F98" stroke-width="1.2"/>
  <text x="355" y="192" text-anchor="end" font-size="12" fill="#1A1D23">4 output retries =</text>
  <text x="361" y="192" text-anchor="start" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2A4AD4">escalation.required_output_retries</text>
  <text x="380" y="222" text-anchor="middle" font-size="12" fill="#5C6370">Each arrow is a failed validation. The run stops at the first valid answer.</text>
</svg>
